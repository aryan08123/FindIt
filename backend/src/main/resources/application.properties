spring.application.name=findit-backend
server.port=8080

# Optional local file for secrets (git-ignored). Environment variables also work.
spring.config.import=optional:file:./local.properties

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/findit_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA / Hibernate ----------
# validate = Hibernate only checks that entities match database/schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- File upload ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=uploads

# ---------- CORS (React dev server) ----------
app.cors.allowed-origins=http://localhost:3000

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ---------- Demo accounts created at startup (set enabled=false for production) ----------
app.seed.enabled=true
app.seed.admin-password=${ADMIN_PASSWORD:Admin@123}
app.seed.student-password=${STUDENT_PASSWORD:Student@123}